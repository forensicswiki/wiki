# Check Markdown files.
name: lint
on:
  pull_request:
  push:
permissions: read-all
jobs:
  check-escaping:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install tox
      run: |
        python -m pip install tox
    - name: Run escaping check
      run: |
        tox -e check-escaping
  check-nonascii:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install tox
      run: |
        python -m pip install tox
    - name: Run non-ASCII check
      run: |
        tox -e check-nonascii
  check-tags:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install tox
      run: |
        python -m pip install tox
    - name: Run tag check
      run: |
        tox -e check-tags
  pymarkdown:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install tox
      run: |
        python -m pip install tox
    - name: Run pymarkdown
      run: |
        tox -e pymarkdown
