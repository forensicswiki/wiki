[tox]
envlist = linkcheck,pymarkdown

[testenv:linkcheck]
allowlist_externals = ./build_index.sh
skipsdist = true
skip_install = true
deps =
    certifi >= 2023.11.17
    myst_parser
    sphinx
commands =
    ./build_index.sh
    sphinx-build -b linkcheck docs dist

[testenv:pymarkdown]
skipsdist = True
pip_pre = True
deps =
    pymarkdownlnt
commands =
    pymarkdown --config pymarkdown.json scan . docs
