[tox]
envlist = check-escaping, check-nonascii, check-tags, pymarkdown

[testenv:check-escaping]
skipsdist = True
commands =
    python scripts/check_escaping.py --check docs

[testenv:check-nonascii]
skipsdist = True
commands =
    python scripts/check_nonascii.py --check docs

[testenv:check-tags]
skipsdist = True
commands =
    python scripts/check_tags.py --check docs

[testenv:pymarkdown]
skipsdist = True
pip_pre = True
deps =
    pymarkdownlnt
commands =
    pymarkdown --config pymarkdown.json scan . docs
